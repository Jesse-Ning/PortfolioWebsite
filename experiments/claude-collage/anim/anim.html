<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Torn Paper Claude</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  html, body { margin: 0; height: 100%; background: #1b1a18; }
  body { display: grid; place-items: center; }
  canvas { display: block; height: 100vh; width: auto; max-width: 100vw; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(async () => {
  const W = 1080, H = 1920, S = 1, FPS = 30, DURATION = 10;
  const BEAT = 0.5, SIX = BEAT / 4; // 120 BPM, 16th = 0.125s

  const main = document.getElementById('c');
  main.width = W * S; main.height = H * S;
  const out = main.getContext('2d');
  let ctx = out;

  const C = {
    cream: '#EFE5CF', paper: '#FBF6EA', ink: '#1F1C19',
    blue: '#2E43C4', clay: '#D9734A', mustard: '#F1B533',
    teal: '#1E8C80', pink: '#EE8E98', tan: '#C99E68',
    plum: '#3B2F78', skin: '#EDB792', sage: '#7FA36B', news: '#E9E2D0'
  };

  let s = 20261005 >>> 0;
  const rnd = () => { s += 0x6D2B79F5; let t = s; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const R = (a, b) => a + rnd() * (b - a);
  const pick = arr => arr[Math.floor(rnd() * arr.length)];
  const hash = (a, b) => { let h = Math.imul(a * 374761393 + b * 668265263, 1274126177); h ^= h >>> 13; h = Math.imul(h, 1103515245); return ((h ^ h >>> 16) >>> 0) / 4294967296; };

  const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const rgba = (h, a) => { const [r, g, b] = hex(h); return `rgba(${r},${g},${b},${a})`; };
  const mix = (h1, h2, t) => { const a = hex(h1), b = hex(h2); return '#' + a.map((v, i) => Math.round(v + (b[i] - v) * t).toString(16).padStart(2, '0')).join(''); };

  // ---------------- geometry + paper helpers (same as the poster) ----------------
  const rot = (pts, ang, cx, cy) => pts.map(([x, y]) => {
    const dx = x - cx, dy = y - cy, c = Math.cos(ang), n = Math.sin(ang);
    return [cx + dx * c - dy * n, cy + dx * n + dy * c];
  });
  const rect = (x, y, w, h, ang = 0) => rot([[x, y], [x + w, y], [x + w, y + h], [x, y + h]], ang, x + w / 2, y + h / 2);
  const circle = (cx, cy, r, n = 28, wob = 0) => Array.from({ length: n }, (_, i) => {
    const a = i / n * Math.PI * 2, rr = r * (1 + R(-wob, wob));
    return [cx + Math.cos(a) * rr, cy + Math.sin(a) * rr];
  });
  const area = pts => pts.reduce((acc, p, i) => { const q = pts[(i + 1) % pts.length]; return acc + p[0] * q[1] - q[0] * p[1]; }, 0) / 2;
  function offsetPoly(pts, d) {
    const sign = area(pts) > 0 ? 1 : -1, n = pts.length;
    const norm = (a, b) => { const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1; return [dy / L * sign, -dx / L * sign]; };
    return pts.map((p, i) => {
      const n1 = norm(pts[(i - 1 + n) % n], p), n2 = norm(p, pts[(i + 1) % n]);
      const nx = n1[0] + n2[0], ny = n1[1] + n2[1], L = Math.hypot(nx, ny) || 1;
      const k = Math.min(2.2, 2 / L);
      return [p[0] + nx / L * d * k, p[1] + ny / L * d * k];
    });
  }
  function torn(pts, rough = 1) {
    const res = [];
    const rec = (p, q, depth, amp) => {
      if (depth <= 0) { res.push(q); return; }
      const dx = q[0] - p[0], dy = q[1] - p[1], L = Math.hypot(dx, dy) || 1, off = R(-0.5, 0.5) * amp;
      const m = [(p[0] + q[0]) / 2 - dy / L * off, (p[1] + q[1]) / 2 + dx / L * off];
      rec(p, m, depth - 1, amp * 0.56); rec(m, q, depth - 1, amp * 0.56);
    };
    for (let i = 0; i < pts.length; i++) {
      const p = pts[i], q = pts[(i + 1) % pts.length], L = Math.hypot(q[0] - p[0], q[1] - p[1]);
      rec(p, q, Math.max(1, Math.min(8, Math.ceil(Math.log2(L / 3)))), Math.min(L * 0.09, 16) * rough);
    }
    return res.map(([x, y]) => [x + R(-0.7, 0.7), y + R(-0.7, 0.7)]);
  }
  const path = pts => { ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); };
  const bbox = pts => { const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]); return { x: Math.min(...xs), y: Math.min(...ys), w: Math.max(...xs) - Math.min(...xs), h: Math.max(...ys) - Math.min(...ys) }; };
  const grow = (b, d) => ({ x: b.x - d, y: b.y - d, w: b.w + d * 2, h: b.h + d * 2 });

  function crayon(color, b, ang = -0.35, density = 1) {
    const n = Math.floor(b.w * b.h / 260 * density);
    ctx.lineCap = 'round';
    for (let i = 0; i < n; i++) {
      const x = R(b.x - 20, b.x + b.w + 20), y = R(b.y - 20, b.y + b.h + 20), len = R(14, 60), a = ang + R(-0.25, 0.25);
      ctx.strokeStyle = rgba(rnd() < 0.55 ? mix(color, '#ffffff', 0.45) : mix(color, '#000000', 0.25), R(0.05, 0.14));
      ctx.lineWidth = R(2, 7);
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len); ctx.stroke();
    }
    for (let i = 0; i < n * 0.35; i++) {
      ctx.fillStyle = rgba(rnd() < 0.5 ? '#ffffff' : '#000000', R(0.04, 0.1));
      ctx.fillRect(R(b.x, b.x + b.w), R(b.y, b.y + b.h), R(0.6, 2), R(0.6, 2));
    }
  }
  function piece(pts, fill, o = {}) {
    const rimW = o.rim ?? 6, rough = o.rough ?? 1;
    const facePts = o.cut ? pts : torn(pts, rough * 0.7);
    const rimPts = o.cut ? pts : torn(offsetPoly(pts, rimW), rough * 1.15);
    ctx.save();
    if (o.shadow !== false) {
      ctx.shadowColor = `rgba(45,28,12,${o.shadowA ?? 0.3})`;
      ctx.shadowBlur = o.blur ?? 14; ctx.shadowOffsetX = 3; ctx.shadowOffsetY = o.lift ?? 6;
    }
    path(o.cut ? facePts : rimPts); ctx.fillStyle = o.cut ? fill : (o.rimColor || C.paper); ctx.fill();
    ctx.restore();
    ctx.save();
    path(o.cut ? facePts : rimPts); ctx.clip();
    if (!o.cut) { path(facePts); ctx.fillStyle = fill; ctx.fill(); }
    path(facePts); ctx.clip();
    if (o.tex !== false) crayon(fill, bbox(facePts), o.ang ?? -0.35, o.density ?? 1);
    if (o.after) o.after(bbox(facePts));
    ctx.restore();
  }
  function tapeAt(cx, cy, w, h, ang) {
    const pts = [[-w / 2, -h / 2], [w / 2, -h / 2]];
    for (let i = 1; i <= 5; i++) pts.push([w / 2 + (i % 2 ? -5 : 0), -h / 2 + h * i / 6]);
    pts.push([w / 2, h / 2], [-w / 2, h / 2]);
    for (let i = 5; i >= 1; i--) pts.push([-w / 2 + (i % 2 ? 5 : 0), -h / 2 + h * i / 6]);
    const p = rot(pts.map(([x, y]) => [x + cx, y + cy]), ang, cx, cy);
    ctx.save(); ctx.shadowColor = 'rgba(40,25,10,.15)'; ctx.shadowBlur = 4; ctx.shadowOffsetY = 1;
    path(p); ctx.fillStyle = 'rgba(238,224,180,.78)'; ctx.fill(); ctx.restore();
    ctx.save(); path(p); ctx.clip(); const b = bbox(p);
    for (let i = 0; i < 60; i++) { ctx.fillStyle = `rgba(255,255,255,${R(0.05, 0.18)})`; ctx.fillRect(R(b.x, b.x + b.w), R(b.y, b.y + b.h), R(4, 18), 1.2); }
    ctx.restore();
  }
  function scribble(x0, x1, y0, y1, color, gap = 24, size = 6) {
    ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = 1.05; ctx.lineJoin = 'round';
    for (let y = y0; y < y1; y += gap) {
      let x = x0 + R(0, 20);
      while (x < x1) {
        const wl = R(16, 70); ctx.beginPath(); ctx.moveTo(x, y);
        for (let t = 0; t < wl; t += 2.4) {
          const up = rnd() < 0.08 ? -size * 1.6 : 0, dn = rnd() < 0.04 ? size * 1.2 : 0;
          ctx.lineTo(x + t, y - Math.abs(Math.sin(t * 0.9 + R(0, 1))) * size + up + dn);
        }
        ctx.stroke(); x += wl + R(6, 14);
      }
    }
    ctx.restore();
  }
  function halftone(b, color, spacing, rFn) {
    ctx.fillStyle = color;
    for (let y = b.y; y < b.y + b.h; y += spacing) for (let x = b.x + ((y / spacing) % 2 ? spacing / 2 : 0); x < b.x + b.w; x += spacing) {
      const r = rFn(x, y); if (r > 0.2) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
    }
  }
  function hand(pts, color, w = 4, jit = 1.4) {
    ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (let pass = 0; pass < 2; pass++) {
      ctx.globalAlpha = pass ? 0.55 : 0.95; ctx.beginPath();
      pts.forEach(([x, y], i) => { const px = x + R(-jit, jit), py = y + R(-jit, jit); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); });
      ctx.stroke();
    }
    ctx.restore();
  }
  function text(str, x, y, font, color, o = {}) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(o.ang || 0);
    ctx.font = font; ctx.fillStyle = color; ctx.textAlign = o.align || 'left'; ctx.textBaseline = o.base || 'alphabetic';
    ctx.fillText(str, 0, 0); ctx.restore();
  }
  const F = {
    anton: '"Anton", "Liberation Sans", sans-serif', abril: '"Abril Fatface", "DejaVu Serif", serif',
    mono: '"Space Mono", "DejaVu Sans Mono", monospace', hand: '"Caveat", "DejaVu Sans", cursive',
    serifSC: '"Noto Serif SC", "WenQuanYi Zen Hei", serif', kuaile: '"ZCOOL KuaiLe", "WenQuanYi Zen Hei", sans-serif'
  };
  await Promise.all([
    ['400 40px "Anton"', 'A'], ['400 40px "Abril Fatface"', 'A'], ['700 40px "Space Mono"', 'A'],
    ['700 40px "Caveat"', 'a'], ['900 40px "Noto Serif SC"', '撕开问题拼出答案'], ['400 40px "ZCOOL KuaiLe"', '今天想']
  ].map(([f, t]) => document.fonts.load(f, t).catch(() => null)));

  // ---------------- sprite system ----------------
  function sprite(bb, draw, pad = 50) {
    const c = document.createElement('canvas');
    const w = Math.ceil(bb.w + pad * 2), h = Math.ceil(bb.h + pad * 2);
    c.width = w * S; c.height = h * S;
    const prev = ctx; ctx = c.getContext('2d'); ctx.scale(S, S); ctx.translate(-bb.x + pad, -bb.y + pad);
    draw(); ctx = prev;
    return { cv: c, x: bb.x - pad, y: bb.y - pad, w, h };
  }
  const els = [];
  const CUES = [];
  const cue = (t, sfx, p = 0) => CUES.push({ t: +t.toFixed(4), sfx, p });
  // anim: {type, t (landing time), dur, lead, from, ...}; o: pivot, beat pulse, boil, out
  function el(bb, draw, anim, o = {}) {
    const sp = sprite(bb, draw, o.pad);
    const e = { sp, anim, z: els.length, pivot: o.pivot || [bb.x + bb.w / 2, bb.y + bb.h / 2], boil: o.boil ?? 1, pulse: o.pulse, out: o.out, blink: o.blink, sway: o.sway };
    els.push(e);
    if (anim && anim.sfx) cue(anim.t, anim.sfx, anim.p || 0);
    return e;
  }
  function P(pts, fill, po, anim, o = {}, extra) {
    return el(grow(bbox(pts), (po.rim ?? 6) + 18), () => { piece(pts, fill, po); if (extra) extra(); }, anim, o);
  }

  // ---------------- build scene ----------------
  // background (static)
  const bg = sprite({ x: 0, y: 0, w: W, h: H }, () => {
    ctx.fillStyle = C.cream; ctx.fillRect(0, 0, W, H);
    const g = ctx.createRadialGradient(W / 2, H * 0.45, 200, W / 2, H / 2, 1200);
    g.addColorStop(0, 'rgba(255,255,255,.18)'); g.addColorStop(1, 'rgba(120,90,50,.18)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip(); crayon(C.cream, { x: 0, y: 0, w: W, h: H }, 0.1, 0.35); ctx.restore();
    scribble(18, W - 18, 22, H, 'rgba(95,72,48,.22)', 22, 5);
  }, 0);

  // header
  el({ x: 60, y: 100, w: W - 120, h: 8 }, () => { ctx.strokeStyle = C.ink; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(60, 104); ctx.lineTo(W - 60, 104); ctx.stroke(); },
    { type: 'wipeX', t: 0.25, dur: 0.35 }, { boil: 0, pad: 4 });
  P(rect(56, 46, 300, 44, -0.01), C.paper, { rim: 3, rough: 0.5, blur: 6, lift: 3, density: 0.4 }, { type: 'pop', t: 0.25, sfx: 'tick', p: 0 }, {},
    () => text('NO.05 — SELF·PORTRAIT', 72, 78, `700 22px ${F.mono}`, C.ink));
  P(rect(W - 266, 44, 210, 46, 0.02), C.ink, { rim: 4, rough: 0.5, blur: 6, lift: 3, density: 0.5 }, { type: 'pop', t: 0.375, sfx: 'tick', p: 2 }, {},
    () => text('2026 / 10', W - 161, 77, `700 24px ${F.mono}`, C.paper, { align: 'center' }));

  // backdrop papers
  P(rect(118, 128, 900, 300, 0.035), C.mustard, { rim: 8, ang: -0.2 }, { type: 'slideY', t: 0.5, from: -500, sfx: 'whoosh', p: 0 });
  P(rect(40, 990, 360, 310, -0.06), C.pink, { rim: 8 }, { type: 'slideX', t: 0.5, from: -600 });
  const panelPts = rect(66, 150, 948, 1130, -0.018);
  P(panelPts, C.blue, { rim: 9, rough: 1.1, ang: -0.45, density: 1.25, blur: 22, lift: 10,
    after: b => scribble(b.x + 20, b.x + b.w - 20, b.y + 1000, b.y + b.h, 'rgba(255,255,255,.07)', 20, 4) },
    { type: 'slam', t: 0.0, sfx: 'slap', p: 1 }, { boil: 0.4 });
  P(circle(812, 610, 160, 40, 0.01), C.pink, { rim: 7, ang: 0.4, after: b => {
    halftone(b, rgba('#B0425A', 0.55), 13, (x, y) => { const d = Math.hypot(x - 700, y - 720) / 330; return Math.max(0, 5.5 * (d - 0.25)); });
  } }, { type: 'pop', t: 0.75, sfx: 'pop', p: -3 }, { pulse: { from: 4.25, amp: 0.025, every: 1, offset: 0.5 } });

  // ransom headline
  function ransom(str, x0, y0, size, gapX, styles, t0, step, sfx, pitch0) {
    let x = x0, k = 0;
    [...str].forEach((ch, i) => {
      if (ch === ' ') { x += size * 0.38; return; }
      const st = styles[i % styles.length];
      const font = `${st.w || 400} ${size * (st.k || 1)}px ${st.f}`;
      ctx.font = font;
      const tw = ctx.measureText(ch).width, padX = size * 0.16, h = size * 1.12 * (st.k || 1);
      const w = tw + padX * 2, ang = R(-0.13, 0.13), yy = y0 + R(-10, 10);
      const pts = rect(x, yy - h, w, h, ang), xx = x;
      P(pts, st.bg, { rim: st.cut ? 0 : 5, cut: st.cut, rough: 0.6, density: 0.5, blur: 9, lift: 4, after: () => {
        if (st.dots) halftone({ x: xx - 10, y: yy - h - 10, w: w + 20, h: h + 20 }, rgba(st.dots, 0.35), 7, () => 1.6);
      } }, { type: 'pop', t: t0 + k * step, sfx, p: pitch0 + k, spin: R(-0.6, 0.6) }, {},
      () => text(ch, xx + w / 2, yy - h * 0.18, font, st.fg, { align: 'center', ang }));
      x += w + gapX; k++;
    });
  }
  ctx.font = '10px sans-serif';
  ransom('HELLO,', 112, 316, 118, 6, [
    { f: F.anton, bg: C.paper, fg: C.ink }, { f: F.abril, bg: C.clay, fg: C.paper, cut: true },
    { f: F.anton, bg: C.ink, fg: C.mustard }, { f: F.abril, bg: C.news, fg: C.blue, dots: C.ink },
    { f: F.anton, bg: C.mustard, fg: C.ink, cut: true }, { f: F.abril, bg: C.paper, fg: C.clay }
  ], 1.0, BEAT / 2, 'pop', 0);
  ransom("I'M CLAUDE", 128, 440, 76, 4, [
    { f: F.abril, bg: C.pink, fg: C.ink, cut: true }, { f: F.anton, bg: C.paper, fg: C.ink },
    { f: F.mono, w: 700, bg: C.ink, fg: C.paper, k: 0.95 }, { f: F.anton, bg: C.paper, fg: C.ink },
    { f: F.anton, bg: C.clay, fg: C.paper }, { f: F.abril, bg: C.mustard, fg: C.ink, cut: true },
    { f: F.mono, w: 700, bg: C.news, fg: C.blue, k: 0.95 }, { f: F.anton, bg: C.teal, fg: C.paper },
    { f: F.abril, bg: C.paper, fg: C.clay }, { f: F.anton, bg: C.ink, fg: C.pink, cut: true }
  ], 2.5, SIX, 'tick', 4);

  // pinned doodle note: paper slams, then the </> is drawn on
  P(rect(808, 182, 178, 214, 0.08), C.paper, { rim: 0, cut: true, density: 0.25, blur: 10 }, { type: 'slam', t: 6.75, sfx: 'slap', p: 0 });
  el({ x: 830, y: 220, w: 140, h: 150 }, () => {
    ctx.save(); ctx.translate(897, 282); ctx.rotate(0.08);
    hand([[-36, -34], [-58, 0], [-36, 34]], C.clay, 7); hand([[36, -34], [58, 0], [36, 34]], C.clay, 7);
    hand([[12, -44], [-12, 44]], C.clay, 7); hand([[-60, 74], [60, 72]], C.sage, 5);
    ctx.restore();
  }, { type: 'wipeX', t: 6.875, dur: 0.375, sfx: 'scribble', p: 0.375 }, { pad: 10 });
  el({ x: 840, y: 165, w: 110, h: 45 }, () => tapeAt(895, 186, 96, 28, -0.12), { type: 'pop', t: 6.875, sfx: 'tick', p: 1 }, { pad: 10 });

  // ---------------- figure ----------------
  const bodyAnim = { type: 'slideY', t: 3.75, from: 900, dur: 0.45, sfx: 'whoosh', p: 1 };
  P([[330, 1010], [430, 968], [650, 968], [758, 1010], [800, 1300], [292, 1300]], C.teal, { rim: 7, ang: 0.6, density: 1.2 }, bodyAnim);
  P([[452, 972], [540, 996], [512, 1046], [440, 1018]], C.paper, { rim: 3, rough: 0.5, density: 0.3 }, { type: 'pop', t: 4.25, sfx: 'tick', p: 3 });
  P([[628, 972], [540, 996], [568, 1046], [640, 1018]], C.paper, { rim: 3, rough: 0.5, density: 0.3 }, { type: 'pop', t: 4.375, sfx: 'tick', p: 5 });

  // raised arm group: swings up from the shoulder, then taps to the beat
  const shoulder = [742, 1000];
  const armAnim = { type: 'swing', t: 5.0, from: 2.2, dur: 0.8 };
  const armO = { pivot: shoulder, sway: { from: 5.6, amp: 0.05 } };
  P([[712, 1004], [768, 990], [930, 1040], [902, 1100], [752, 1078]], C.teal, { rim: 6, ang: 0.2 }, { ...armAnim, sfx: 'swish', p: 0 }, armO);
  P([[872, 1080], [936, 1056], [934, 860], [880, 846]], C.teal, { rim: 6, ang: -1.3 }, armAnim, armO);
  const pc = [904, 760], pa = 0.32;
  const PP = pts => rot(pts.map(([x, y]) => [x + pc[0], y + pc[1]]), pa, pc[0], pc[1]);
  P(PP([[-15, -60], [15, -60], [15, 70], [-15, 70]]), C.mustard, { rim: 4, rough: 0.4, ang: 1.5, density: 0.7 }, armAnim, armO);
  P(PP([[-15, -60], [15, -60], [0, -110]]), C.skin, { rim: 3, rough: 0.3, density: 0.3, shadow: false }, armAnim, armO,
    () => piece(PP([[-5, -94], [5, -94], [0, -112]]), C.ink, { cut: true, shadow: false, tex: false }));
  P(PP([[-15, 70], [15, 70], [15, 92], [-15, 92]]), C.pink, { rim: 3, rough: 0.4, density: 0.5, shadow: false }, armAnim, armO);
  P(circle(902, 836, 44, 26, 0.04), C.skin, { rim: 5, ang: 0.3, density: 0.7 }, armAnim, armO);
  P(rect(866, 806, 44, 20, -0.3), C.skin, { rim: 3, rough: 0.4, density: 0.4, blur: 5, lift: 2 }, armAnim, armO);

  // spark head
  const hc = [540, 742];
  const spark = [];
  for (let i = 0; i < 12; i++) {
    const a = -Math.PI / 2 + i / 12 * Math.PI * 2 + R(-0.06, 0.06);
    const len = (i % 2 ? 206 : 238) * R(0.92, 1.04), da = Math.PI / 12 * 0.62, tw = 15;
    spark.push([hc[0] + Math.cos(a - da) * 104, hc[1] + Math.sin(a - da) * 104]);
    const tc = [hc[0] + Math.cos(a) * (len - tw), hc[1] + Math.sin(a) * (len - tw)];
    for (let k = -2; k <= 2; k++) { const b = a + k * Math.PI / 4; spark.push([tc[0] + Math.cos(b) * tw, tc[1] + Math.sin(b) * tw]); }
    spark.push([hc[0] + Math.cos(a + da) * 104, hc[1] + Math.sin(a + da) * 104]);
  }
  const headAnim = { type: 'spin', t: 4.0, dur: 0.6 };
  const headO = { pivot: hc, pulse: { from: 4.5, amp: 0.045, every: 0.5, offset: 0 } };
  P(spark, C.clay, { rim: 8, rough: 0.9, ang: -0.6, density: 1.3, blur: 20, lift: 9 }, { ...headAnim, sfx: 'boom', p: 0 }, headO);
  P(circle(hc[0], hc[1] + 6, 92, 34, 0.02), C.paper, { rim: 0, rough: 0.6, density: 0.35 }, headAnim, headO);
  el({ x: hc[0] - 75, y: hc[1] + 12, w: 150, h: 40 }, () => {
    [[-50, 26], [50, 26]].forEach(([dx, dy]) => { ctx.fillStyle = rgba(C.pink, 0.85); ctx.beginPath(); ctx.arc(hc[0] + dx, hc[1] + dy + 6, 18, 0, Math.PI * 2); ctx.fill(); });
  }, { type: 'pop', t: 4.875, sfx: 'blip', p: 4 }, { ...headO, pad: 8 });
  const eyes = (dx) => el({ x: hc[0] + dx - 12, y: hc[1] - 18, w: 24, h: 24 }, () => {
    ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(hc[0] + dx, hc[1] - 6, 10, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = C.paper; ctx.beginPath(); ctx.arc(hc[0] + dx + 3, hc[1] - 9, 3, 0, Math.PI * 2); ctx.fill();
  }, { type: 'pop', t: dx < 0 ? 4.5 : 4.625, sfx: 'blip', p: dx < 0 ? 0 : 2 }, { ...headO, pad: 6, blink: [6.25, 8.75] });
  eyes(-30); eyes(30);
  el({ x: hc[0] - 14, y: hc[1] + 26, w: 28, h: 28 }, () => {
    ctx.strokeStyle = C.ink; ctx.lineWidth = 4.5; ctx.beginPath(); ctx.ellipse(hc[0], hc[1] + 40, 9, 11, 0, 0, Math.PI * 2); ctx.stroke();
  }, { type: 'pop', t: 4.75, sfx: 'blip', p: 1 }, { ...headO, pad: 6, out: 9.5 });
  el({ x: hc[0] - 26, y: hc[1] + 28, w: 52, h: 26 }, () => {
    ctx.strokeStyle = C.ink; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(hc[0], hc[1] + 26, 20, 0.25 * Math.PI, 0.75 * Math.PI); ctx.stroke();
  }, { type: 'pop', t: 9.5 }, { ...headO, pad: 6 });
  P(rect(hc[0] + 34, hc[1] - 88, 62, 20, -0.5), C.mustard, { rim: 3, rough: 0.4, density: 0.5, blur: 6, lift: 3 }, { type: 'pop', t: 5.25, sfx: 'tick', p: 6 }, headO);

  // idea dashes burst out of the head
  for (let i = 0; i < 9; i++) {
    const a = -Math.PI * 0.9 + i / 8 * Math.PI * 0.8;
    const p1 = [hc[0] + Math.cos(a) * 268, hc[1] + Math.sin(a) * 268], p2 = [hc[0] + Math.cos(a) * 300, hc[1] + Math.sin(a) * 300];
    el(grow(bbox([p1, p2]), 8), () => hand([p1, p2], C.paper, 8, 1),
      { type: 'burst', t: 5.5 + i * 0.012, dur: 0.3, sfx: i === 0 ? 'ding' : null }, { pivot: hc, pad: 8, pulse: { from: 6, amp: 0.05, every: 0.5, offset: 0 } });
  }

  // speech bubble
  const bub = [[96, 590], [338, 572], [352, 690], [300, 700], [330, 752], [256, 704], [104, 712]];
  P(bub, C.paper, { rim: 0, rough: 0.8, density: 0.3, blur: 12 }, { type: 'pop', t: 5.75, sfx: 'pop', p: 7 }, { pivot: [300, 720] }, () => {
    text('今天想一起', 124, 634, `400 38px ${F.kuaile}`, C.ink, { ang: -0.03 });
    text('做点什么？', 128, 684, `400 38px ${F.kuaile}`, C.clay, { ang: -0.03 });
  });

  // handwritten "idea!"
  el({ x: 780, y: 860, w: 110, h: 110 }, () => {
    text('idea!', 786, 958, `700 46px ${F.hand}`, C.paper, { ang: -0.18 });
    hand([[838, 930], [856, 894], [874, 872]], C.paper, 3.5); hand([[862, 884], [874, 872], [870, 890]], C.paper, 3.5);
  }, { type: 'wipeX', t: 7.25, dur: 0.25, sfx: 'scribble', p: 0.25 }, { pad: 10 });

  // stamp
  el({ x: 90, y: 975, w: 172, h: 172 }, () => {
    ctx.save(); ctx.translate(176, 1060); ctx.rotate(-0.22);
    ctx.globalAlpha = 0.9; ctx.strokeStyle = C.mustard; ctx.fillStyle = C.mustard;
    ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(0, 0, 78, 0, Math.PI * 2); ctx.stroke();
    ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, 54, 0, Math.PI * 2); ctx.stroke();
    const ring = 'ASK ANYTHING · ANYTIME · ';
    ctx.font = `700 15px ${F.mono}`; ctx.textAlign = 'center';
    [...ring].forEach((ch, i) => { ctx.save(); ctx.rotate(i / ring.length * Math.PI * 2); ctx.fillText(ch, 0, -61); ctx.restore(); });
    ctx.font = `400 46px ${F.abril}`; ctx.textBaseline = 'middle'; ctx.fillText('C', 0, 2);
    ctx.globalAlpha = 1;
    for (let i = 0; i < 260; i++) { ctx.fillStyle = rgba(C.blue, R(0.4, 0.95)); ctx.beginPath(); ctx.arc(R(-85, 85), R(-85, 85), R(0.6, 2.4), 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();
  }, { type: 'stamp', t: 7.0, sfx: 'stamp', p: 0 }, { pad: 10 });

  // sparkles (appear on the final hit and twinkle)
  const sparkleAt = (x, y, r, col, t) => el({ x: x - r - 4, y: y - r - 4, w: r * 2 + 8, h: r * 2 + 8 }, () => {
    hand([[x - r, y], [x + r, y]], col, 4); hand([[x, y - r], [x, y + r]], col, 4);
  }, { type: 'pop', t }, { pad: 6, pulse: { from: t + 0.25, amp: 0.25, every: 0.25, offset: 0 } });
  sparkleAt(150, 860, 16, C.mustard, 0.75); sparkleAt(980, 520, 12, C.paper, 0.875); sparkleAt(220, 1130, 10, C.paper, 9.5);

  // desk, books, plant
  P(rect(-30, 1288, W + 60, 92, 0.004), C.tan, { rim: 7, ang: 0.05, density: 1.1, blur: 16 }, { type: 'slideX', t: 6.0, from: 1300, sfx: 'whoosh', p: 2 }, { boil: 0.3 });
  P(rect(392, 1258, 330, 18, -0.01), C.plum, { rim: 3, rough: 0.4, density: 0.6, blur: 6, lift: 3 }, { type: 'drop', t: 6.25, sfx: 'thud', p: 0 });
  P(rect(398, 1238, 316, 16, 0.01), C.paper, { rim: 2, rough: 0.3, density: 0.3, blur: 5, lift: 2 }, { type: 'drop', t: 6.375, sfx: 'thud', p: 1 });
  P(rect(404, 1220, 304, 18, -0.005), C.clay, { rim: 3, rough: 0.4, density: 0.6, blur: 5, lift: 2 }, { type: 'drop', t: 6.5, sfx: 'thud', p: 2 });
  P(circle(452, 1214, 34, 22, 0.05), C.skin, { rim: 5, density: 0.6 }, { type: 'pop', t: 6.625, sfx: 'blip', p: 3 });
  const plantAnim = { type: 'grow', t: 6.625, dur: 0.35 };
  const plantO = { pivot: [880, 1290] };
  P([[836, 1170], [924, 1170], [912, 1290], [848, 1290]], C.clay, { rim: 5, density: 0.8 }, plantAnim, plantO);
  P([[874, 1170], [846, 1092], [870, 1080], [886, 1168]], C.sage, { rim: 4, rough: 0.5, density: 0.6, ang: -1.2 }, plantAnim, plantO);
  P([[886, 1170], [918, 1100], [946, 1104], [898, 1172]], C.sage, { rim: 4, rough: 0.5, density: 0.6, ang: -0.6 }, plantAnim, plantO);
  P(circle(866, 1060, 20, 18, 0.05), C.pink, { rim: 4, rough: 0.5, density: 0.4 }, { type: 'pop', t: 6.75, sfx: null }, { pulse: { from: 7, amp: 0.12, every: 0.5, offset: 0.25 } },
    () => { ctx.fillStyle = C.mustard; ctx.beginPath(); ctx.arc(866, 1060, 7, 0, Math.PI * 2); ctx.fill(); });
  P(rect(-30, 1378, W + 60, 64, -0.003), C.plum, { rim: 5, density: 0.8, after: b => scribble(b.x + 20, b.x + b.w, b.y + 26, b.y + b.h, 'rgba(255,255,255,.12)', 20, 5) },
    { type: 'slideX', t: 6.0, from: -1300 }, { boil: 0.3 });

  // headline strips: tear in, characters slam on 16ths
  function strip(str, x, y, w, h, ang, bg, fg, t0) {
    P(rect(x, y, w, h, ang), bg, { rim: 8, rough: 1, density: 1.1, blur: 18, lift: 8 }, { type: 'tear', t: t0, dur: 0.12, sfx: 'rip', p: 0 });
    const cx = x + w / 2, cy = y + h / 2;
    [...str].forEach((ch, i) => {
      const lx = cx + (i - (str.length - 1) / 2) * 118;
      const [px, py] = rot([[lx, cy]], ang, cx, cy)[0];
      const dx = R(-3, 3), dy = R(-5, 5), a = ang + R(-0.06, 0.06);
      el({ x: px - 66, y: py - 66, w: 132, h: 132 }, () => text(ch, px + dx, py + 40 + dy, `900 112px ${F.serifSC}`, fg, { align: 'center', ang: a }),
        { type: 'slam', t: t0 + i * SIX, sfx: 'hit', p: i }, { pad: 10 });
    });
  }
  strip('撕开问题', 56, 1462, 548, 150, -0.03, C.ink, C.paper, 8.0);
  strip('拼出答案', 130, 1618, 548, 150, 0.022, C.clay, C.paper, 8.5);
  el({ x: 140, y: 1770, w: 450, h: 60 }, () => text('tear it open, piece it together', 150, 1810, `700 40px ${F.hand}`, C.ink, { ang: -0.02 }),
    { type: 'wipeX', t: 9.0, dur: 0.45 }, { pad: 10 });

  // ticket
  const tk = rect(700, 1474, 316, 368, 0.05);
  P(tk, C.paper, { rim: 0, rough: 0.7, density: 0.3, blur: 16, lift: 8, after: () => {
    ctx.save(); ctx.translate(858, 1658); ctx.rotate(0.05);
    ctx.fillStyle = C.ink; ctx.font = `700 18px ${F.mono}`; ctx.textAlign = 'left';
    ctx.fillText('ADMIT ONE', -130, -150); ctx.fillText('NO.000001', 30, -150);
    ctx.strokeStyle = C.ink; ctx.lineWidth = 1.5; ctx.setLineDash([5, 5]);
    ctx.beginPath(); ctx.moveTo(-140, -134); ctx.lineTo(140, -134); ctx.stroke(); ctx.setLineDash([]);
    ctx.font = `400 36px ${F.kuaile}`; ctx.fillText('入场券', -130, -88);
    ['写代码', '改文案', '读资料', '陪你想'].forEach((t, i) => {
      const y = -40 + i * 42;
      ctx.strokeStyle = C.ink; ctx.lineWidth = 2; ctx.strokeRect(-128, y - 20, 22, 22);
      ctx.font = `400 26px ${F.kuaile}`; ctx.fillStyle = C.ink; ctx.fillText(t, -94, y);
    });
    let bx = -128;
    while (bx < 128) { const bw = pick([1.5, 2, 3, 4]); ctx.fillStyle = C.ink; ctx.fillRect(bx, 128, bw, 36); bx += bw + pick([1.5, 2, 3]); }
    ctx.font = `700 12px ${F.mono}`; ctx.fillText('1 CURIOUS HUMAN + 1 AI', -128, 120);
    ctx.restore();
  } }, { type: 'slideX', t: 7.5, from: 520, dur: 0.4, sfx: 'swish', p: 1 });
  [0, 1, 2, 3].forEach(i => {
    const y = -40 + i * 42;
    const [wx, wy] = rot([[858 - 117, 1658 + y - 10]], 0.05, 858, 1658)[0];
    el({ x: wx - 12, y: wy - 18, w: 32, h: 32 }, () => hand([[wx - 8, wy], [wx - 1, wy + 9], [wx + 16, wy - 14]], C.clay, 4.5, 0.8),
      { type: 'wipeX', t: 9.0 + i * SIX, dur: 0.09, sfx: 'check', p: i }, { pad: 8 });
  });
  el({ x: 950, y: 1470, w: 90, h: 80 }, () => tapeAt(990, 1500, 100, 30, 0.75), { type: 'pop', t: 7.75, sfx: 'tick', p: 3 }, { pad: 10 });

  // footer
  el({ x: 60, y: 1854, w: W - 120, h: 8 }, () => { ctx.strokeStyle = C.ink; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(60, 1858); ctx.lineTo(W - 60, 1858); ctx.stroke(); },
    { type: 'wipeX', t: 9.0, dur: 0.3 }, { boil: 0, pad: 4 });
  el({ x: 56, y: 1866, w: 460, h: 44 }, () => text('你负责好奇，我负责陪你想透。', 60, 1898, `400 30px ${F.kuaile}`, C.ink),
    { type: 'slideY', t: 9.125, from: 80, dur: 0.3 }, { pad: 6, boil: 0 });
  el({ x: 640, y: 1874, w: 384, h: 30 }, () => text('CLAUDE · CODE / WRITE / THINK', W - 60, 1896, `700 18px ${F.mono}`, C.ink, { align: 'right' }),
    { type: 'slideY', t: 9.25, from: 80, dur: 0.3 }, { pad: 6, boil: 0 });

  // whole-scene hits
  const shakes = [{ t: 0.0, amp: 6 }, { t: 4.0, amp: 14 }, { t: 7.0, amp: 7 }, { t: 9.5, amp: 9 }];
  const bounces = [{ t: 4.0, amp: 0.025 }, { t: 9.5, amp: 0.03 }];
  cue(3.0, 'riser', 1.0);
  cue(9.5, 'final', 0);

  // ---------------- grain plates ----------------
  const grains = [0, 1, 2, 3].map(k => {
    const c = document.createElement('canvas'); c.width = W * S / 2; c.height = H * S / 2;
    const g = c.getContext('2d'), img = g.createImageData(c.width, c.height), d = img.data;
    for (let i = 0; i < d.length; i += 4) { const v = rnd() < 0.5 ? 0 : 255; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = R(0, 22); }
    g.putImageData(img, 0, 0); return c;
  });

  // ---------------- animation ----------------
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const easeOutCubic = p => 1 - Math.pow(1 - p, 3);
  const easeInCubic = p => p * p * p;
  const easeOutBack = (p, c1 = 1.70158) => { const c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
  const easeOutElastic = p => p === 0 ? 0 : p === 1 ? 1 : Math.pow(2, -10 * p) * Math.sin((p * 10 - 0.75) * (2 * Math.PI) / 3) + 1;
  const LEAD = { slam: 0.09, pop: 0, slideX: 0.16, slideY: 0.16, spin: 0.28, swing: 0.1, wipeX: 0, tear: 0, burst: 0, stamp: 0.07, drop: 0.12, grow: 0 };
  const DUR = { slam: 0.32, pop: 0.28, slideX: 0.38, slideY: 0.38, spin: 0.6, swing: 0.8, wipeX: 0.3, tear: 0.12, burst: 0.3, stamp: 0.35, drop: 0.3, grow: 0.35 };

  function state(e, t) {
    const st = { x: 0, y: 0, r: 0, s: 1, sx: 1, sy: 1, a: 1, wipe: null, tear: null };
    const a = e.anim;
    if (e.out !== undefined && t >= e.out) return null;
    if (a) {
      const lead = a.lead ?? LEAD[a.type], dur = a.dur ?? DUR[a.type], t0 = a.t - lead;
      if (t < t0) return null;
      const u = t - t0, p = clamp(u / dur);
      switch (a.type) {
        case 'slam': {
          if (u < lead) { const q = u / lead; st.s = lerp(1.5, 1, easeInCubic(q)); st.a = clamp(q * 2.5); st.r = (1 - q) * 0.08; }
          else { const v = clamp((u - lead) / (dur - lead)); st.sx = 1 + 0.06 * Math.sin(v * Math.PI) * (1 - v); st.sy = 1 - 0.06 * Math.sin(v * Math.PI) * (1 - v); }
          break;
        }
        case 'stamp': {
          if (u < lead) { const q = u / lead; st.s = lerp(1.8, 1, easeInCubic(q)); st.a = 0; }
          else { const v = clamp((u - lead) / 0.08); st.a = v; st.s = 1 + 0.05 * (1 - v); }
          break;
        }
        case 'pop': st.s = Math.max(0, easeOutBack(p, 2.6)); st.a = clamp(p * 5); st.r = (a.spin || 0) * (1 - easeOutCubic(p)); break;
        case 'burst': st.s = lerp(0.55, 1, easeOutBack(p, 2)); st.a = clamp(p * 4); break;
        case 'grow': st.sy = Math.max(0, easeOutBack(p, 2.2)); st.sx = lerp(0.6, 1, easeOutCubic(p)); break;
        case 'slideX': st.x = a.from * (1 - easeOutBack(p, 1.2)); break;
        case 'slideY': st.y = a.from * (1 - easeOutBack(p, 1.2)); break;
        case 'drop': st.y = -260 * (1 - easeOutBack(p, 1.6)); st.a = clamp(p * 6); break;
        case 'spin': st.s = Math.max(0, easeOutBack(p, 1.9)); st.r = -2.6 * (1 - easeOutCubic(p)); break;
        case 'swing': st.r = a.from * (1 - easeOutElastic(p)); break;
        case 'wipeX': st.wipe = easeOutCubic(p); break;
        case 'tear': st.tear = easeOutCubic(p); break;
      }
    }
    if (e.pulse && t >= e.pulse.from) {
      const ph = ((t - e.pulse.from - e.pulse.offset) % e.pulse.every + e.pulse.every) % e.pulse.every;
      st.s *= 1 + e.pulse.amp * Math.exp(-ph * 9);
    }
    if (e.sway && t >= e.sway.from) { // pencil taps on every beat
      const ph = ((t - e.sway.from) % BEAT) / BEAT;
      st.r += -e.sway.amp * Math.exp(-ph * 6) * Math.sin(ph * Math.PI * 2 + Math.PI / 2) * 0.6;
    }
    if (e.blink) for (const tb of e.blink) if (t >= tb && t < tb + 0.1) st.sy *= 0.12;
    if (e.boil) { // stop-motion "boil" on 12fps steps
      const k = Math.floor(t * 12);
      st.r += (hash(e.z, k) - 0.5) * 0.008 * e.boil;
      st.x += (hash(e.z + 999, k) - 0.5) * 1.6 * e.boil; st.y += (hash(e.z + 555, k) - 0.5) * 1.6 * e.boil;
    }
    return st;
  }

  function tearClip(sp, p, seed) { // jagged reveal edge, left to right
    const x = sp.x + sp.w * p;
    ctx.beginPath(); ctx.moveTo(sp.x, sp.y);
    for (let i = 0; i <= 24; i++) { const y = sp.y + sp.h * i / 24; ctx.lineTo(x + (hash(seed, i) - 0.5) * 36, y); }
    ctx.lineTo(sp.x, sp.y + sp.h); ctx.closePath(); ctx.clip();
  }

  function renderFrame(t) {
    ctx = out;
    ctx.setTransform(S, 0, 0, S, 0, 0);
    ctx.globalAlpha = 1;
    ctx.drawImage(bg.cv, 0, 0, W, H);
    ctx.save();
    // global shake + bounce
    let gx = 0, gy = 0, gs = 1;
    const k = Math.floor(t * FPS);
    for (const sh of shakes) if (t >= sh.t) { const d = Math.exp(-(t - sh.t) * 14) * sh.amp; gx += (hash(k, 7) - 0.5) * 2 * d; gy += (hash(k, 13) - 0.5) * 2 * d; }
    for (const b of bounces) if (t >= b.t) gs += b.amp * Math.exp(-(t - b.t) * 10);
    // camera: slow push-in on the panel, then pull out to the full poster landing on 6.0s
    const easeIO = p => p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
    const camIn = lerp(1.12, 1.17, clamp(t / 5.75)), q = easeIO(clamp((t - 5.6) / 0.4));
    const cs = lerp(camIn, 1, q), cy = lerp(715, H / 2, q);
    ctx.translate(W / 2 + gx, H / 2 + gy); ctx.scale(gs * cs, gs * cs); ctx.translate(-W / 2, -cy);
    for (const e of els) {
      const st = state(e, t); if (!st || st.a <= 0) continue;
      const sp = e.sp, [px, py] = e.pivot;
      ctx.save();
      ctx.translate(px + st.x, py + st.y); ctx.rotate(st.r); ctx.scale(st.s * st.sx, st.s * st.sy); ctx.translate(-px, -py);
      ctx.globalAlpha = clamp(st.a);
      if (st.wipe !== null) { ctx.beginPath(); ctx.rect(sp.x, sp.y, sp.w * st.wipe, sp.h); ctx.clip(); }
      if (st.tear !== null) tearClip(sp, st.tear, e.z);
      ctx.drawImage(sp.cv, sp.x, sp.y, sp.w, sp.h);
      ctx.restore();
    }
    ctx.restore();
    // film grain flicker (12fps) + flash on the final hit
    ctx.globalAlpha = 1;
    ctx.drawImage(grains[Math.floor(t * 12) % 4], 0, 0, W, H);
    if (t >= 9.5 && t < 9.6) { ctx.fillStyle = `rgba(255,248,230,${0.35 * (1 - (t - 9.5) / 0.1)})`; ctx.fillRect(0, 0, W, H); }
  }

  window.CUES = CUES.sort((a, b) => a.t - b.t);
  window.renderFrame = renderFrame;
  window.META = { FPS, DURATION, W, H };
  const preview = params => {
    const t0 = performance.now();
    const loop = () => { const t = ((performance.now() - t0) / 1000) % DURATION; renderFrame(t); requestAnimationFrame(loop); };
    loop();
  };
  if (new URLSearchParams(location.search).has('play')) preview(); else renderFrame(DURATION - 0.01);
  document.body.dataset.ready = '1';
})();
</script>
</body>
