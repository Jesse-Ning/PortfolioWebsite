<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Torn Open Cover</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  html, body { margin: 0; height: 100%; background: #1b1a18; }
  body { display: grid; place-items: center; }
  canvas { display: block; height: 100vh; width: auto; max-width: 100vw; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(async () => {
  const W = 1080, H = 1920;
  const params = new URLSearchParams(location.search);
  const S = Number(params.get('scale') || 2);
  const cv = document.getElementById('c');
  cv.width = W * S; cv.height = H * S;
  const ctx = cv.getContext('2d');
  ctx.scale(S, S);

  // three colours + paper + ink. Nothing else.
  const C = { paper: '#EEE6D3', fibre: '#FBF7EC', ink: '#17150F', blue: '#2337C6', clay: '#E0663A' };

  let s = Number(params.get('seed') || 77) >>> 0;
  const rnd = () => { s += 0x6D2B79F5; let t = s; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const R = (a, b) => a + rnd() * (b - a);
  const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const rgba = (h, a) => { const [r, g, b] = hex(h); return `rgba(${r},${g},${b},${a})`; };
  const mix = (h1, h2, t) => { const a = hex(h1), b = hex(h2); return '#' + a.map((v, i) => Math.round(v + (b[i] - v) * t).toString(16).padStart(2, '0')).join(''); };
  const rot = (pts, ang, cx, cy) => pts.map(([x, y]) => { const dx = x - cx, dy = y - cy, c = Math.cos(ang), n = Math.sin(ang); return [cx + dx * c - dy * n, cy + dx * n + dy * c]; });
  const rect = (x, y, w, h, ang = 0) => rot([[x, y], [x + w, y], [x + w, y + h], [x, y + h]], ang, x + w / 2, y + h / 2);

  function torn(pts, rough = 1, cap = 16) {
    const out = [];
    const rec = (p, q, d, amp) => {
      if (d <= 0) { out.push(q); return; }
      const dx = q[0] - p[0], dy = q[1] - p[1], L = Math.hypot(dx, dy) || 1, off = R(-0.5, 0.5) * amp;
      const m = [(p[0] + q[0]) / 2 - dy / L * off, (p[1] + q[1]) / 2 + dx / L * off];
      rec(p, m, d - 1, amp * 0.56); rec(m, q, d - 1, amp * 0.56);
    };
    for (let i = 0; i < pts.length; i++) {
      const p = pts[i], q = pts[(i + 1) % pts.length], L = Math.hypot(q[0] - p[0], q[1] - p[1]);
      rec(p, q, Math.max(1, Math.min(8, Math.ceil(Math.log2(L / 3)))), Math.min(L * 0.09, cap) * rough);
    }
    return out.map(([x, y]) => [x + R(-0.7, 0.7), y + R(-0.7, 0.7)]);
  }
  const trace = pts => pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
  const path = pts => { ctx.beginPath(); trace(pts); ctx.closePath(); };
  const bbox = pts => { const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]); return { x: Math.min(...xs), y: Math.min(...ys), w: Math.max(...xs) - Math.min(...xs), h: Math.max(...ys) - Math.min(...ys) }; };
  const scalePts = (pts, k, cx, cy) => pts.map(([x, y]) => [cx + (x - cx) * k, cy + (y - cy) * k]);

  function crayon(color, b, ang = -0.35, density = 1, alpha = 1) {
    const n = Math.floor(b.w * b.h / 260 * density);
    ctx.lineCap = 'round';
    for (let i = 0; i < n; i++) {
      const x = R(b.x - 20, b.x + b.w + 20), y = R(b.y - 20, b.y + b.h + 20), len = R(14, 70), a = ang + R(-0.2, 0.2);
      ctx.strokeStyle = rgba(rnd() < 0.55 ? mix(color, '#ffffff', 0.4) : mix(color, '#000000', 0.25), R(0.04, 0.12) * alpha);
      ctx.lineWidth = R(2, 8);
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len); ctx.stroke();
    }
    for (let i = 0; i < n * 0.4; i++) {
      ctx.fillStyle = rgba(rnd() < 0.5 ? '#ffffff' : '#000000', R(0.03, 0.09));
      ctx.fillRect(R(b.x, b.x + b.w), R(b.y, b.y + b.h), R(0.6, 2.2), R(0.6, 2.2));
    }
  }
  function text(str, x, y, font, color, o = {}) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(o.ang || 0);
    ctx.font = font; ctx.fillStyle = color; ctx.textAlign = o.align || 'left'; ctx.textBaseline = o.base || 'alphabetic';
    if (o.ls) ctx.letterSpacing = o.ls + 'px';
    ctx.fillText(str, 0, 0); ctx.restore();
  }
  const F = {
    anton: '"Anton", sans-serif', mono: '"Space Mono", monospace', hand: '"Caveat", cursive',
    serifSC: '"Noto Serif SC", "WenQuanYi Zen Hei", serif', kuaile: '"ZCOOL KuaiLe", "WenQuanYi Zen Hei", sans-serif'
  };
  await Promise.all([['400 40px "Anton"', 'A'], ['700 40px "Space Mono"', 'A'], ['700 40px "Caveat"', 'a'],
    ['900 40px "Noto Serif SC"', '撕开问题拼出答案'], ['400 40px "ZCOOL KuaiLe"', '写代码']].map(([f, t]) => document.fonts.load(f, t).catch(() => null)));

  // ================= layer 1: the blue underneath =================
  ctx.fillStyle = C.blue; ctx.fillRect(0, 0, W, H);
  crayon(C.blue, { x: 0, y: 0, w: W, h: H }, -0.5, 0.9);
  // halftone that gets denser towards the edge of the hole
  const hc = [540, 760];
  ctx.fillStyle = rgba('#0c1660', 0.55);
  for (let y = 0; y < 1400; y += 12) for (let x = (y / 12) % 2 ? 6 : 0; x < W; x += 12) {
    const d = Math.hypot(x - hc[0], (y - hc[1]) * 0.9) / 520, r = Math.max(0, (d - 0.35) * 6.5);
    if (r > 0.3) { ctx.beginPath(); ctx.arc(x, y, Math.min(r, 5.5), 0, Math.PI * 2); ctx.fill(); }
  }

  // ================= the spark (drawn once, reused for "burst through" overlay) =================
  const rays = 12, rIn = 150, spark = [];
  for (let i = 0; i < rays; i++) {
    const a = -Math.PI / 2 + i / rays * Math.PI * 2 + R(-0.05, 0.05);
    const len = (i % 2 ? 380 : 460) * R(0.95, 1.03), da = Math.PI / rays * 0.74, tw = 30;
    spark.push([hc[0] + Math.cos(a - da) * rIn, hc[1] + Math.sin(a - da) * rIn]);
    const tc = [hc[0] + Math.cos(a) * (len - tw), hc[1] + Math.sin(a) * (len - tw)];
    for (let k = -2; k <= 2; k++) { const b = a + k * Math.PI / 4; spark.push([tc[0] + Math.cos(b) * tw, tc[1] + Math.sin(b) * tw]); }
    spark.push([hc[0] + Math.cos(a + da) * rIn, hc[1] + Math.sin(a + da) * rIn]);
  }
  const sparkFace = torn(spark, 0.8), sparkRim = torn(scalePts(spark, 1.03, hc[0], hc[1]), 1);
  function drawSpark(shadow) {
    ctx.save();
    if (shadow) { ctx.shadowColor = 'rgba(5,10,40,.45)'; ctx.shadowBlur = 40; ctx.shadowOffsetX = 10; ctx.shadowOffsetY = 22; }
    path(sparkRim); ctx.fillStyle = C.fibre; ctx.fill();
    ctx.restore();
    ctx.save(); path(sparkRim); ctx.clip(); path(sparkFace); ctx.fillStyle = C.clay; ctx.fill(); ctx.clip();
    crayon(C.clay, bbox(sparkFace), -0.7, 1.4);
    ctx.restore();
  }
  drawSpark(true);

  // ================= layer 2: cream paper with a hole torn through it =================
  const holeBase = [];
  for (let i = 0; i < 9; i++) {
    const a = i / 9 * Math.PI * 2 + R(-0.12, 0.12);
    const rx = 440 * R(0.9, 1.06), ry = 500 * R(0.9, 1.05);
    holeBase.push([hc[0] + Math.cos(a) * rx, hc[1] + 10 + Math.sin(a) * ry]);
  }
  const holeFace = torn(holeBase, 1.6, 40);                                // edge of the cream print surface
  const holeRim = torn(scalePts(holeBase, 0.955, hc[0], hc[1] + 10), 1.8, 40); // white fibrous core, slightly further in
  const page = [[0, 0], [W, 0], [W, H], [0, H]];
  // fibre ring with an inward shadow onto the blue
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,20,.55)'; ctx.shadowBlur = 36; ctx.shadowOffsetX = 6; ctx.shadowOffsetY = 18;
  ctx.beginPath(); trace(page); ctx.closePath(); trace(holeRim); ctx.closePath();
  ctx.fillStyle = C.fibre; ctx.fill('evenodd');
  ctx.restore();
  // printed cream surface
  ctx.save();
  ctx.beginPath(); trace(page); ctx.closePath(); trace(holeFace); ctx.closePath();
  ctx.fillStyle = C.paper; ctx.fill('evenodd'); ctx.clip('evenodd');
  crayon(C.paper, { x: 0, y: 0, w: W, h: H }, 0.15, 0.45);
  // faint newsprint columns on the cream for print texture
  ctx.fillStyle = 'rgba(40,30,20,.06)';
  for (let y = 40; y < H; y += 9) for (let x = 40; x < W - 40; x += R(12, 60)) ctx.fillRect(x, y, R(6, 40), 3);
  ctx.restore();

  // curled flap peeling off the top-right edge of the hole
  {
    const i0 = Math.floor(holeFace.length * 0.86), i1 = Math.floor(holeFace.length * 0.97);
    const edge = holeFace.slice(i0, i1);
    const A = edge[0], B = edge[edge.length - 1];
    const mx = (A[0] + B[0]) / 2, my = (A[1] + B[1]) / 2;
    const nx = hc[0] - mx, ny = hc[1] - my, L = Math.hypot(nx, ny);
    const tip = [mx + nx / L * 150 + 30, my + ny / L * 150];
    const flap = [A, ...torn([A, tip, B], 1.2, 20).slice(0, -1), B];
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,20,.5)'; ctx.shadowBlur = 30; ctx.shadowOffsetX = 8; ctx.shadowOffsetY = 20;
    path(flap); ctx.fillStyle = C.fibre; ctx.fill();
    ctx.restore();
    ctx.save(); path(flap); ctx.clip();
    const g = ctx.createLinearGradient(mx, my, tip[0], tip[1]);
    g.addColorStop(0, '#d9cfb8'); g.addColorStop(0.55, '#f6efde'); g.addColorStop(1, '#fffaf0');
    ctx.fillStyle = g; ctx.fill();
    crayon('#efe7d4', bbox(flap), 0.4, 0.5, 0.6);
    ctx.restore();
  }

  // ================= spark bursts back OVER the paper on some rays =================
  ctx.save();
  ctx.beginPath(); trace(page); ctx.closePath(); trace(holeFace); ctx.closePath(); ctx.clip('evenodd');
  ctx.beginPath();
  [[-2.15, -1.55], [-0.35, 0.25], [1.25, 1.9], [2.55, 3.05]].forEach(([a0, a1]) => {
    ctx.moveTo(hc[0], hc[1]); ctx.arc(hc[0], hc[1], 700, a0, a1); ctx.closePath();
  });
  ctx.clip();
  drawSpark(true);
  ctx.restore();

  // eye dots: just enough to read as a character, still a mark
  ctx.fillStyle = C.ink;
  [[-34, -8], [34, -8]].forEach(([dx, dy]) => { ctx.beginPath(); ctx.ellipse(hc[0] + dx, hc[1] + dy, 11, 15, 0, 0, Math.PI * 2); ctx.fill(); });

  // ================= headline =================
  function strip(str, x, y, w, h, ang, bg, fg, size, step) {
    const pts = rect(x, y, w, h, ang);
    const face = torn(pts, 0.9), rim = torn(scalePts(pts, 1.015, x + w / 2, y + h / 2), 1.1);
    ctx.save(); ctx.shadowColor = 'rgba(30,20,10,.35)'; ctx.shadowBlur = 24; ctx.shadowOffsetX = 4; ctx.shadowOffsetY = 12;
    path(rim); ctx.fillStyle = C.fibre; ctx.fill(); ctx.restore();
    ctx.save(); path(rim); ctx.clip(); path(face); ctx.fillStyle = bg; ctx.fill(); ctx.clip(); crayon(bg, bbox(face), -0.3, 1); ctx.restore();
    const cx = x + w / 2, cy = y + h / 2;
    [...str].forEach((ch, i) => {
      const [px, py] = rot([[cx + (i - (str.length - 1) / 2) * step, cy]], ang, cx, cy)[0];
      text(ch, px, py + size * 0.36, `900 ${size}px ${F.serifSC}`, fg, { align: 'center', ang: ang + R(-0.03, 0.03) });
    });
  }
  strip('撕开问题', 36, 1300, 1008, 250, -0.035, C.ink, C.fibre, 212, 232);
  strip('拼出答案', 36, 1535, 1008, 250, 0.025, C.clay, C.fibre, 212, 232);

  // ================= small type only =================
  text('NO.05', 56, 92, `700 24px ${F.mono}`, C.ink);
  text('A SELF-PORTRAIT IN TORN PAPER', W - 56, 92, `700 20px ${F.mono}`, C.ink, { align: 'right', ls: 1 });
  text("hi, I'm Claude.", 58, 236, `700 64px ${F.hand}`, C.ink, { ang: -0.06 });
  // hand-drawn arrow into the hole
  ctx.save(); ctx.strokeStyle = C.ink; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(420, 210); ctx.bezierCurveTo(500, 190, 560, 240, 560, 300); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(538, 276); ctx.lineTo(560, 304); ctx.lineTo(584, 280); ctx.stroke();
  ctx.restore();
  text('写代码 · 改文案 · 读资料 · 陪你想', 56, 1866, `400 30px ${F.kuaile}`, C.ink);
  text('CLAUDE', W - 56, 1868, `400 40px ${F.anton}`, C.ink, { align: 'right', ls: 4 });

  // ================= grain =================
  const img = ctx.getImageData(0, 0, cv.width, cv.height), d = img.data;
  for (let i = 0; i < d.length; i += 4) { const n = (rnd() - 0.5) * 20; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  ctx.putImageData(img, 0, 0);
  document.body.dataset.ready = '1';
})();
</script>
</body>
</html>
