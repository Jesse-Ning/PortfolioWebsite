<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Torn Paper Claude</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  :root { --bg: #1b1a18; }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  body { display: grid; place-items: center; }
  canvas { display: block; height: 100vh; width: auto; max-width: 100vw; aspect-ratio: 9 / 16; object-fit: contain; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(async () => {
  const W = 1080, H = 1920;
  const params = new URLSearchParams(location.search);
  const S = Number(params.get('scale') || 2);
  const SEED = Number(params.get('seed') || 20261005);

  const cv = document.getElementById('c');
  cv.width = W * S; cv.height = H * S;
  const ctx = cv.getContext('2d');
  ctx.scale(S, S);

  // ---------- palette ----------
  const C = {
    cream: '#EFE5CF', paper: '#FBF6EA', ink: '#1F1C19',
    blue: '#2E43C4', clay: '#D9734A', mustard: '#F1B533',
    teal: '#1E8C80', pink: '#EE8E98', tan: '#C99E68',
    plum: '#3B2F78', skin: '#EDB792', sage: '#7FA36B', news: '#E9E2D0'
  };

  // ---------- rng ----------
  let s = SEED >>> 0;
  const rnd = () => { s += 0x6D2B79F5; let t = s; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const R = (a, b) => a + rnd() * (b - a);
  const pick = arr => arr[Math.floor(rnd() * arr.length)];

  // ---------- color helpers ----------
  const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const rgba = (h, a) => { const [r, g, b] = hex(h); return `rgba(${r},${g},${b},${a})`; };
  const mix = (h1, h2, t) => { const a = hex(h1), b = hex(h2); return '#' + a.map((v, i) => Math.round(v + (b[i] - v) * t).toString(16).padStart(2, '0')).join(''); };

  // ---------- geometry ----------
  const rot = (pts, ang, cx, cy) => pts.map(([x, y]) => {
    const dx = x - cx, dy = y - cy, c = Math.cos(ang), n = Math.sin(ang);
    return [cx + dx * c - dy * n, cy + dx * n + dy * c];
  });
  const rect = (x, y, w, h, ang = 0) => rot([[x, y], [x + w, y], [x + w, y + h], [x, y + h]], ang, x + w / 2, y + h / 2);
  const circle = (cx, cy, r, n = 28, wob = 0) => Array.from({ length: n }, (_, i) => {
    const a = i / n * Math.PI * 2, rr = r * (1 + R(-wob, wob));
    return [cx + Math.cos(a) * rr, cy + Math.sin(a) * rr];
  });
  const area = pts => pts.reduce((acc, p, i) => { const q = pts[(i + 1) % pts.length]; return acc + p[0] * q[1] - q[0] * p[1]; }, 0) / 2;

  function offsetPoly(pts, d) {
    const sign = area(pts) > 0 ? 1 : -1, n = pts.length;
    const norm = (a, b) => { const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1; return [dy / L * sign, -dx / L * sign]; };
    return pts.map((p, i) => {
      const n1 = norm(pts[(i - 1 + n) % n], p), n2 = norm(p, pts[(i + 1) % n]);
      let nx = n1[0] + n2[0], ny = n1[1] + n2[1]; const L = Math.hypot(nx, ny) || 1;
      const k = Math.min(2.2, 2 / L); // miter length, capped so sharp corners don't spike
      return [p[0] + nx / L * d * k, p[1] + ny / L * d * k];
    });
  }

  // fractal midpoint displacement => torn paper edge
  function torn(pts, rough = 1) {
    const out = [];
    const rec = (p, q, depth, amp) => {
      if (depth <= 0) { out.push(q); return; }
      const dx = q[0] - p[0], dy = q[1] - p[1], L = Math.hypot(dx, dy) || 1;
      const off = R(-0.5, 0.5) * amp;
      const m = [(p[0] + q[0]) / 2 - dy / L * off, (p[1] + q[1]) / 2 + dx / L * off];
      rec(p, m, depth - 1, amp * 0.56); rec(m, q, depth - 1, amp * 0.56);
    };
    for (let i = 0; i < pts.length; i++) {
      const p = pts[i], q = pts[(i + 1) % pts.length];
      const L = Math.hypot(q[0] - p[0], q[1] - p[1]);
      const depth = Math.max(1, Math.min(8, Math.ceil(Math.log2(L / 3))));
      rec(p, q, depth, Math.min(L * 0.09, 16) * rough);
    }
    return out.map(([x, y]) => [x + R(-0.7, 0.7), y + R(-0.7, 0.7)]);
  }

  const path = pts => { ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); };
  const bbox = pts => { const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]); return { x: Math.min(...xs), y: Math.min(...ys), w: Math.max(...xs) - Math.min(...xs), h: Math.max(...ys) - Math.min(...ys) }; };

  // crayon / gouache texture inside current clip
  function crayon(color, b, ang = -0.35, density = 1) {
    const n = Math.floor(b.w * b.h / 260 * density);
    ctx.lineCap = 'round';
    for (let i = 0; i < n; i++) {
      const x = R(b.x - 20, b.x + b.w + 20), y = R(b.y - 20, b.y + b.h + 20);
      const len = R(14, 60), a = ang + R(-0.25, 0.25);
      const light = rnd() < 0.55;
      ctx.strokeStyle = rgba(light ? mix(color, '#ffffff', 0.45) : mix(color, '#000000', 0.25), R(0.05, 0.14));
      ctx.lineWidth = R(2, 7);
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len); ctx.stroke();
    }
    // paper fibres
    for (let i = 0; i < n * 0.35; i++) {
      ctx.fillStyle = rgba(rnd() < 0.5 ? '#ffffff' : '#000000', R(0.04, 0.1));
      ctx.fillRect(R(b.x, b.x + b.w), R(b.y, b.y + b.h), R(0.6, 2), R(0.6, 2));
    }
  }

  // one torn paper piece: white fibrous rim + coloured face + texture
  function piece(pts, fill, o = {}) {
    const rimW = o.rim ?? 6, rough = o.rough ?? 1;
    const facePts = o.cut ? pts : torn(pts, rough * 0.7);
    const rimPts = o.cut ? pts : torn(offsetPoly(pts, rimW), rough * 1.15);
    ctx.save();
    if (o.shadow !== false) {
      ctx.shadowColor = `rgba(45,28,12,${o.shadowA ?? 0.3})`;
      ctx.shadowBlur = o.blur ?? 14; ctx.shadowOffsetX = 3; ctx.shadowOffsetY = o.lift ?? 6;
    }
    path(o.cut ? facePts : rimPts);
    ctx.fillStyle = o.cut ? fill : (o.rimColor || C.paper);
    ctx.fill();
    ctx.restore();
    ctx.save();
    path(o.cut ? facePts : rimPts); ctx.clip();
    if (!o.cut) { path(facePts); ctx.fillStyle = fill; ctx.fill(); }
    path(facePts); ctx.clip();
    if (o.tex !== false) crayon(fill, bbox(facePts), o.ang ?? -0.35, o.density ?? 1);
    if (o.after) o.after(bbox(facePts));
    ctx.restore();
    return facePts;
  }

  function tape(cx, cy, w, h, ang) {
    const pts = [];
    const zig = (x0, side) => { for (let i = 0; i <= 6; i++) pts.push([x0 + (i % 2 ? side * 4 : 0), -h / 2 + h * i / 6]); };
    pts.push([-w / 2, -h / 2], [w / 2, -h / 2]);
    for (let i = 1; i <= 5; i++) pts.push([w / 2 + (i % 2 ? -5 : 0), -h / 2 + h * i / 6]);
    pts.push([w / 2, h / 2], [-w / 2, h / 2]);
    for (let i = 5; i >= 1; i--) pts.push([-w / 2 + (i % 2 ? 5 : 0), -h / 2 + h * i / 6]);
    const p = rot(pts.map(([x, y]) => [x + cx, y + cy]), ang, cx, cy);
    ctx.save();
    ctx.shadowColor = 'rgba(40,25,10,.15)'; ctx.shadowBlur = 4; ctx.shadowOffsetY = 1;
    path(p); ctx.fillStyle = 'rgba(238,224,180,.72)'; ctx.fill();
    ctx.restore();
    ctx.save(); path(p); ctx.clip();
    const b = bbox(p);
    for (let i = 0; i < 60; i++) { ctx.fillStyle = `rgba(255,255,255,${R(0.05, 0.18)})`; ctx.fillRect(R(b.x, b.x + b.w), R(b.y, b.y + b.h), R(4, 18), 1.2); }
    ctx.restore();
  }

  // fake handwriting rows, like the newsprint margins of the reference
  function scribble(x0, x1, y0, y1, color, gap = 24, size = 6) {
    ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = 1.05; ctx.lineJoin = 'round';
    for (let y = y0; y < y1; y += gap) {
      let x = x0 + R(0, 20);
      while (x < x1) {
        const wl = R(16, 70);
        ctx.beginPath(); ctx.moveTo(x, y);
        for (let t = 0; t < wl; t += 2.4) {
          const up = rnd() < 0.08 ? -size * 1.6 : 0, dn = rnd() < 0.04 ? size * 1.2 : 0;
          ctx.lineTo(x + t, y - Math.abs(Math.sin(t * 0.9 + R(0, 1))) * size + up + dn);
        }
        ctx.stroke();
        x += wl + R(6, 14);
      }
    }
    ctx.restore();
  }

  function halftone(b, color, spacing, rFn) {
    ctx.fillStyle = color;
    for (let y = b.y; y < b.y + b.h; y += spacing) for (let x = b.x + ((y / spacing) % 2 ? spacing / 2 : 0); x < b.x + b.w; x += spacing) {
      const r = rFn(x, y); if (r > 0.2) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
    }
  }

  // wobbly hand-drawn line
  function hand(pts, color, w = 4, jit = 1.4) {
    ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (let pass = 0; pass < 2; pass++) {
      ctx.globalAlpha = pass ? 0.55 : 0.95;
      ctx.beginPath();
      pts.forEach(([x, y], i) => { const px = x + R(-jit, jit), py = y + R(-jit, jit); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); });
      ctx.stroke();
    }
    ctx.restore();
  }

  function text(str, x, y, font, color, o = {}) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(o.ang || 0);
    ctx.font = font; ctx.fillStyle = color; ctx.textAlign = o.align || 'left'; ctx.textBaseline = o.base || 'alphabetic';
    if (o.spacing) ctx.letterSpacing = o.spacing + 'px';
    ctx.fillText(str, 0, 0); ctx.restore();
  }

  const F = {
    anton: '"Anton", "Liberation Sans", sans-serif',
    abril: '"Abril Fatface", "DejaVu Serif", serif',
    mono: '"Space Mono", "DejaVu Sans Mono", monospace',
    hand: '"Caveat", "DejaVu Sans", cursive',
    serifSC: '"Noto Serif SC", "WenQuanYi Zen Hei", serif',
    kuaile: '"ZCOOL KuaiLe", "WenQuanYi Zen Hei", sans-serif'
  };
  await Promise.all([
    ['400 40px "Anton"', 'A'], ['400 40px "Abril Fatface"', 'A'], ['700 40px "Space Mono"', 'A'],
    ['700 40px "Caveat"', 'a'], ['900 40px "Noto Serif SC"', '撕开问题拼出答案'], ['400 40px "ZCOOL KuaiLe"', '今天想']
  ].map(([f, t]) => document.fonts.load(f, t).catch(() => null)));

  // =====================================================================
  // 1. background paper + handwriting
  ctx.fillStyle = C.cream; ctx.fillRect(0, 0, W, H);
  ctx.save();
  const g = ctx.createRadialGradient(W / 2, H * 0.45, 200, W / 2, H / 2, 1200);
  g.addColorStop(0, 'rgba(255,255,255,.18)'); g.addColorStop(1, 'rgba(120,90,50,.18)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  crayon(C.cream, { x: 0, y: 0, w: W, h: H }, 0.1, 0.35);
  ctx.restore();
  scribble(18, W - 18, 22, H, 'rgba(95,72,48,.22)', 22, 5);

  // header strip
  ctx.save(); ctx.strokeStyle = C.ink; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(60, 104); ctx.lineTo(W - 60, 104); ctx.stroke(); ctx.restore();
  piece(rect(56, 46, 300, 44, -0.01), C.paper, { rim: 3, rough: 0.5, blur: 6, lift: 3, density: 0.4 });
  text('NO.05 — SELF·PORTRAIT', 72, 78, `700 22px ${F.mono}`, C.ink);
  piece(rect(W - 266, 44, 210, 46, 0.02), C.ink, { rim: 4, rough: 0.5, blur: 6, lift: 3, density: 0.5 });
  text('2026 / 10', W - 161, 77, `700 24px ${F.mono}`, C.paper, { align: 'center' });

  // =====================================================================
  // 2. layered backdrop papers
  piece(rect(118, 128, 900, 300, 0.035), C.mustard, { rim: 8, ang: -0.2 });
  piece(rect(40, 990, 360, 310, -0.06), C.pink, { rim: 8 });
  const panel = rect(66, 150, 948, 1130, -0.018);
  piece(panel, C.blue, { rim: 9, rough: 1.1, ang: -0.45, density: 1.25, blur: 22, lift: 10,
    after: b => {
      // faint printed newsprint ghost inside the blue panel
      scribble(b.x + 20, b.x + b.w - 20, b.y + 1000, b.y + b.h, 'rgba(255,255,255,.07)', 20, 4);
    }
  });

  // halftone pink sun behind head
  piece(circle(812, 610, 160, 40, 0.01), C.pink, { rim: 7, ang: 0.4, after: b => {
    halftone(b, rgba('#B0425A', 0.55), 13, (x, y) => { const d = Math.hypot(x - 700, y - 720) / 330; return Math.max(0, 5.5 * (d - 0.25)); });
  }});

  // =====================================================================
  // 3. ransom-note headline
  const ransom = (str, x0, y0, size, gapX, styles) => {
    let x = x0;
    [...str].forEach((ch, i) => {
      if (ch === ' ') { x += size * 0.38; return; }
      const st = styles[i % styles.length];
      ctx.font = `${st.w || 400} ${size * (st.k || 1)}px ${st.f}`;
      const tw = ctx.measureText(ch).width;
      const padX = size * 0.16, h = size * 1.12 * (st.k || 1);
      const w = tw + padX * 2, ang = R(-0.13, 0.13), yy = y0 + R(-10, 10);
      piece(rect(x, yy - h, w, h, ang), st.bg, { rim: st.cut ? 0 : 5, cut: st.cut, rough: 0.6, density: 0.5, blur: 9, lift: 4, after: () => {
        if (st.dots) halftone({ x: x - 10, y: yy - h - 10, w: w + 20, h: h + 20 }, rgba(st.dots, 0.35), 7, () => 1.6);
      }});
      text(ch, x + w / 2, yy - h * 0.18, `${st.w || 400} ${size * (st.k || 1)}px ${st.f}`, st.fg, { align: 'center', ang });
      x += w + gapX;
    });
    return x;
  };
  ransom('HELLO,', 112, 316, 118, 6, [
    { f: F.anton, bg: C.paper, fg: C.ink },
    { f: F.abril, bg: C.clay, fg: C.paper, cut: true },
    { f: F.anton, bg: C.ink, fg: C.mustard },
    { f: F.abril, bg: C.news, fg: C.blue, dots: C.ink },
    { f: F.anton, bg: C.mustard, fg: C.ink, cut: true },
    { f: F.abril, bg: C.paper, fg: C.clay }
  ]);
  ransom("I'M CLAUDE", 128, 440, 76, 4, [
    { f: F.abril, bg: C.pink, fg: C.ink, cut: true },
    { f: F.anton, bg: C.paper, fg: C.ink },
    { f: F.mono, w: 700, bg: C.ink, fg: C.paper, k: 0.95 },
    { f: F.anton, bg: C.paper, fg: C.ink },
    { f: F.anton, bg: C.clay, fg: C.paper },
    { f: F.abril, bg: C.mustard, fg: C.ink, cut: true },
    { f: F.mono, w: 700, bg: C.news, fg: C.blue, k: 0.95 },
    { f: F.anton, bg: C.teal, fg: C.paper },
    { f: F.abril, bg: C.paper, fg: C.clay },
    { f: F.anton, bg: C.ink, fg: C.pink, cut: true }
  ]);

  // pinned drawing (top right), like the kid's sun drawing in the reference
  piece(rect(808, 182, 178, 214, 0.08), C.paper, { rim: 0, cut: true, density: 0.25, blur: 10, after: () => {
    ctx.save(); ctx.translate(897, 282); ctx.rotate(0.08);
    hand([[-36, -34], [-58, 0], [-36, 34]], C.clay, 7);
    hand([[36, -34], [58, 0], [36, 34]], C.clay, 7);
    hand([[12, -44], [-12, 44]], C.clay, 7);
    hand([[-60, 74], [60, 72]], C.sage, 5);
    ctx.restore();
  }});
  tape(895, 186, 96, 28, -0.12);

  // =====================================================================
  // 4. the figure — torn-paper person whose head is a spark
  // left resting arm
  // body / sweater
  piece([[330, 1010], [430, 968], [650, 968], [758, 1010], [800, 1300], [292, 1300]], C.teal, { rim: 7, ang: 0.6, density: 1.2 });
  // collar
  piece([[452, 972], [540, 996], [512, 1046], [440, 1018]], C.paper, { rim: 3, rough: 0.5, density: 0.3 });
  piece([[628, 972], [540, 996], [568, 1046], [640, 1018]], C.paper, { rim: 3, rough: 0.5, density: 0.3 });
  // raised arm (upper + forearm)
  piece([[712, 1004], [768, 990], [930, 1040], [902, 1100], [752, 1078]], C.teal, { rim: 6, ang: 0.2 });
  piece([[872, 1080], [936, 1056], [934, 860], [880, 846]], C.teal, { rim: 6, ang: -1.3 });

  // pencil
  const pc = [904, 760], pa = 0.32;
  const P = pts => rot(pts.map(([x, y]) => [x + pc[0], y + pc[1]]), pa, pc[0], pc[1]);
  piece(P([[-15, -60], [15, -60], [15, 70], [-15, 70]]), C.mustard, { rim: 4, rough: 0.4, ang: 1.5, density: 0.7 });
  piece(P([[-15, -60], [15, -60], [0, -110]]), C.skin, { rim: 3, rough: 0.3, density: 0.3, shadow: false });
  piece(P([[-5, -94], [5, -94], [0, -112]]), C.ink, { cut: true, shadow: false, tex: false });
  piece(P([[-15, 70], [15, 70], [15, 92], [-15, 92]]), C.pink, { rim: 3, rough: 0.4, density: 0.5, shadow: false });
  // hand
  piece(circle(902, 836, 44, 26, 0.04), C.skin, { rim: 5, ang: 0.3, density: 0.7 });
  piece(rect(866, 806, 44, 20, -0.3), C.skin, { rim: 3, rough: 0.4, density: 0.4, blur: 5, lift: 2 });

  // spark head
  const hc = [540, 742];
  const rays = 12, rIn = 104, spark = [];
  for (let i = 0; i < rays; i++) {
    const a = -Math.PI / 2 + i / rays * Math.PI * 2 + R(-0.06, 0.06);
    const len = (i % 2 ? 206 : 238) * R(0.92, 1.04), da = Math.PI / rays * 0.62, tw = 15;
    spark.push([hc[0] + Math.cos(a - da) * rIn, hc[1] + Math.sin(a - da) * rIn]);
    const tc = [hc[0] + Math.cos(a) * (len - tw), hc[1] + Math.sin(a) * (len - tw)];
    for (let k = -2; k <= 2; k++) { const b = a + k * Math.PI / 4; spark.push([tc[0] + Math.cos(b) * tw, tc[1] + Math.sin(b) * tw]); }
    spark.push([hc[0] + Math.cos(a + da) * rIn, hc[1] + Math.sin(a + da) * rIn]);
  }
  piece(spark, C.clay, { rim: 8, rough: 0.9, ang: -0.6, density: 1.3, blur: 20, lift: 9 });
  // face disc
  piece(circle(hc[0], hc[1] + 6, 92, 34, 0.02), C.paper, { rim: 0, rough: 0.6, density: 0.35, after: () => {
    // cheeks
    [[-50, 26], [50, 26]].forEach(([dx, dy]) => {
      ctx.fillStyle = rgba(C.pink, 0.85); ctx.beginPath(); ctx.arc(hc[0] + dx, hc[1] + dy + 6, 18, 0, Math.PI * 2); ctx.fill();
    });
  }});
  [[-30, -6], [30, -6]].forEach(([dx, dy]) => {
    ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(hc[0] + dx, hc[1] + dy, 10, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = C.paper; ctx.beginPath(); ctx.arc(hc[0] + dx + 3, hc[1] + dy - 3, 3, 0, Math.PI * 2); ctx.fill();
  });
  ctx.save(); ctx.strokeStyle = C.ink; ctx.lineWidth = 4.5; ctx.beginPath(); ctx.ellipse(hc[0], hc[1] + 40, 9, 11, 0, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
  // hair clip
  piece(rect(hc[0] + 34, hc[1] - 88, 62, 20, -0.5), C.mustard, { rim: 3, rough: 0.4, density: 0.5, blur: 6, lift: 3 });

  // idea dashes
  for (let i = 0; i < 9; i++) {
    const a = -Math.PI * 0.9 + i / 8 * Math.PI * 0.8;
    const r1 = 268, r2 = 300;
    hand([[hc[0] + Math.cos(a) * r1, hc[1] + Math.sin(a) * r1], [hc[0] + Math.cos(a) * r2, hc[1] + Math.sin(a) * r2]], C.paper, 8, 1);
  }

  // speech bubble
  const bub = [[96, 590], [338, 572], [352, 690], [300, 700], [330, 752], [256, 704], [104, 712]];
  piece(bub, C.paper, { rim: 0, rough: 0.8, density: 0.3, blur: 12 });
  text('今天想一起', 124, 634, `400 38px ${F.kuaile}`, C.ink, { ang: -0.03 });
  text('做点什么？', 128, 684, `400 38px ${F.kuaile}`, C.clay, { ang: -0.03 });

  // hand-written notes on the panel
  text('idea!', 786, 958, `700 46px ${F.hand}`, C.paper, { ang: -0.18 });
  hand([[838, 930], [856, 894], [874, 872]], C.paper, 3.5);
  hand([[862, 884], [874, 872], [870, 890]], C.paper, 3.5);
  // little sparkles
  const sparkle = (x, y, r, col) => { hand([[x - r, y], [x + r, y]], col, 4); hand([[x, y - r], [x, y + r]], col, 4); };
  sparkle(150, 860, 16, C.mustard); sparkle(980, 520, 12, C.paper); sparkle(220, 1130, 10, C.paper);

  // stamp
  ctx.save(); ctx.translate(176, 1060); ctx.rotate(-0.22);
  ctx.globalAlpha = 0.9; ctx.strokeStyle = C.mustard; ctx.fillStyle = C.mustard;
  ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(0, 0, 78, 0, Math.PI * 2); ctx.stroke();
  ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, 54, 0, Math.PI * 2); ctx.stroke();
  const ring = 'ASK ANYTHING · ANYTIME · ';
  ctx.font = `700 15px ${F.mono}`; ctx.textAlign = 'center';
  [...ring].forEach((ch, i) => { ctx.save(); ctx.rotate(i / ring.length * Math.PI * 2); ctx.fillText(ch, 0, -61); ctx.restore(); });
  ctx.font = `400 46px ${F.abril}`; ctx.textBaseline = 'middle'; ctx.fillText('C', 0, 2);
  // worn ink: speckle the stamp with panel blue
  ctx.globalAlpha = 1;
  for (let i = 0; i < 260; i++) { ctx.fillStyle = rgba(C.blue, R(0.4, 0.95)); ctx.beginPath(); ctx.arc(R(-85, 85), R(-85, 85), R(0.6, 2.4), 0, Math.PI * 2); ctx.fill(); }
  ctx.restore();

  // =====================================================================
  // 5. desk + books
  piece(rect(-30, 1288, W + 60, 92, 0.004), C.tan, { rim: 7, ang: 0.05, density: 1.1, blur: 16 });
  piece(rect(392, 1258, 330, 18, -0.01), C.plum, { rim: 3, rough: 0.4, density: 0.6, blur: 6, lift: 3 });
  piece(rect(398, 1238, 316, 16, 0.01), C.paper, { rim: 2, rough: 0.3, density: 0.3, blur: 5, lift: 2 });
  piece(rect(404, 1220, 304, 18, -0.005), C.clay, { rim: 3, rough: 0.4, density: 0.6, blur: 5, lift: 2 });
  piece(circle(452, 1214, 34, 22, 0.05), C.skin, { rim: 5, density: 0.6 });
  // plant
  piece([[836, 1170], [924, 1170], [912, 1290], [848, 1290]], C.clay, { rim: 5, density: 0.8 });
  piece([[874, 1170], [846, 1092], [870, 1080], [886, 1168]], C.sage, { rim: 4, rough: 0.5, density: 0.6, ang: -1.2 });
  piece([[886, 1170], [918, 1100], [946, 1104], [898, 1172]], C.sage, { rim: 4, rough: 0.5, density: 0.6, ang: -0.6 });
  piece(circle(866, 1060, 20, 18, 0.05), C.pink, { rim: 4, rough: 0.5, density: 0.4 });
  ctx.fillStyle = C.mustard; ctx.beginPath(); ctx.arc(866, 1060, 7, 0, Math.PI * 2); ctx.fill();

  // plum band with ghost text
  piece(rect(-30, 1378, W + 60, 64, -0.003), C.plum, { rim: 5, density: 0.8, after: b => scribble(b.x + 20, b.x + b.w, b.y + 26, b.y + b.h, 'rgba(255,255,255,.12)', 20, 5) });

  // =====================================================================
  // 6. headline strips
  const strip = (str, x, y, w, h, ang, bg, fg, punct) => {
    piece(rect(x, y, w, h, ang), bg, { rim: 8, rough: 1, density: 1.1, blur: 18, lift: 8 });
    const cx = x + w / 2, cy = y + h / 2;
    [...str].forEach((ch, i) => {
      const n = str.length, step = 118;
      const lx = cx + (i - (n - 1) / 2) * step;
      const [px, py] = rot([[lx, cy]], ang, cx, cy)[0];
      text(ch, px + R(-3, 3), py + 40 + R(-5, 5), `900 112px ${F.serifSC}`, i === punct ? C.mustard : fg, { align: 'center', ang: ang + R(-0.06, 0.06) });
    });
  };
  strip('撕开问题', 56, 1462, 548, 150, -0.03, C.ink, C.paper);
  strip('拼出答案', 130, 1618, 548, 150, 0.022, C.clay, C.paper);
  text('tear it open, piece it together', 150, 1810, `700 40px ${F.hand}`, C.ink, { ang: -0.02 });

  // ticket
  const tk = rect(700, 1474, 316, 368, 0.05);
  piece(tk, C.paper, { rim: 0, rough: 0.7, density: 0.3, blur: 16, lift: 8, after: () => {
    ctx.save(); ctx.translate(858, 1658); ctx.rotate(0.05);
    ctx.fillStyle = C.ink; ctx.font = `700 18px ${F.mono}`; ctx.textAlign = 'left';
    ctx.fillText('ADMIT ONE', -130, -150);
    ctx.fillText('NO.000001', 30, -150);
    ctx.strokeStyle = C.ink; ctx.lineWidth = 1.5; ctx.setLineDash([5, 5]);
    ctx.beginPath(); ctx.moveTo(-140, -134); ctx.lineTo(140, -134); ctx.stroke(); ctx.setLineDash([]);
    ctx.font = `400 36px ${F.kuaile}`; ctx.fillText('入场券', -130, -88);
    ['写代码', '改文案', '读资料', '陪你想'].forEach((t, i) => {
      const y = -40 + i * 42;
      ctx.strokeStyle = C.ink; ctx.lineWidth = 2; ctx.strokeRect(-128, y - 20, 22, 22);
      ctx.font = `400 26px ${F.kuaile}`; ctx.fillStyle = C.ink; ctx.fillText(t, -94, y);
      ctx.restore(); ctx.save();
      // hand-drawn check marks in world space
      const [wx, wy] = rot([[858 - 117, 1658 + y - 10]], 0.05, 858, 1658)[0];
      hand([[wx - 8, wy], [wx - 1, wy + 9], [wx + 16, wy - 14]], C.clay, 4.5, 0.8);
      ctx.translate(858, 1658); ctx.rotate(0.05);
    });
    // barcode
    let bx = -128;
    while (bx < 128) { const bw = pick([1.5, 2, 3, 4]); ctx.fillStyle = C.ink; ctx.fillRect(bx, 128, bw, 36); bx += bw + pick([1.5, 2, 3]); }
    ctx.font = `700 12px ${F.mono}`; ctx.fillText('1 CURIOUS HUMAN + 1 AI', -128, 120);
    ctx.restore();
  }});
  tape(990, 1500, 100, 30, 0.75);

  // footer
  ctx.save(); ctx.strokeStyle = C.ink; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(60, 1858); ctx.lineTo(W - 60, 1858); ctx.stroke(); ctx.restore();
  text('你负责好奇，我负责陪你想透。', 60, 1898, `400 30px ${F.kuaile}`, C.ink);
  text('CLAUDE · CODE / WRITE / THINK', W - 60, 1896, `700 18px ${F.mono}`, C.ink, { align: 'right' });

  // =====================================================================
  // 7. global grain
  const img = ctx.getImageData(0, 0, cv.width, cv.height), d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (rnd() - 0.5) * 18;
    d[i] += n; d[i + 1] += n; d[i + 2] += n;
  }
  ctx.putImageData(img, 0, 0);
  document.body.dataset.ready = '1';
})();
</script>
