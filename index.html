<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>庞振宁 | 个人作品集</title>
    <meta
      name="description"
      content="庞振宁的游戏设计、战斗系统与UE原型作品集。"
    />
    <link rel="stylesheet" href="styles.css?v=20260621-keyword-labels" />
  </head>
  <body>
    <canvas id="particle-canvas" aria-hidden="true"></canvas>
    <div class="ink-wash" aria-hidden="true"></div>

    <header class="site-header">
      <div class="header-home-group">
        <a class="home-button" href="#top" aria-label="返回最初页">返回首页</a>
        <button class="icon-only" type="button" data-theme-toggle aria-label="切换明暗主题">
          <span data-theme-icon></span>
        </button>
      </div>

      <nav class="site-nav" aria-label="主导航"></nav>
    </header>

    <main id="top">
      <section class="hero section-band" id="about">
        <div class="hero-inner">
          <p class="eyebrow" data-profile-kicker>Game Designer / Gameplay Programmer</p>
          <h1 data-profile-greeting>Hi，我是庞振宁，很高兴遇见你，</h1>
          <p class="hero-title" data-profile-title>游戏设计师 & 战斗系统程序员</p>
          <p class="hero-copy" data-profile-summary>
            我关注动作游戏中的时机、反馈、节奏和玩家决策，喜欢把设计想法落到可玩的系统里。
          </p>
        </div>
      </section>

      <section class="section-band about-detail">
        <div class="section-inner about-grid">
          <div class="about-copy-column">
            <p class="section-kicker" data-section-kicker="about">Personal Introduction</p>
            <h2 data-section-title="about">个人介绍</h2>
            <div class="copy-stack" id="about-copy"></div>
            <div class="contact-actions about-contact-actions" id="about-links" aria-label="联系方式"></div>
          </div>

          <div class="about-sidebar">
            <div class="profile-facts" id="profile-facts" aria-label="个人亮点"></div>
            <div class="profile-keywords" id="profile-keywords" aria-label="个人关键词"></div>
          </div>
        </div>
      </section>


      <section class="section-band projects-section" id="projects">
        <div class="section-inner">
          <div class="section-heading">
            <p class="section-kicker" data-section-kicker="projects">Selected Work</p>
            <h2 data-section-title="projects">个人作品</h2>
          </div>

          <div class="filter-row" id="project-filters" aria-label="作品筛选"></div>
          <div class="project-grid" id="project-grid"></div>
        </div>
      </section>

      <div id="custom-sections"></div>


      <section class="section-band" id="experience">
        <div class="section-inner">
          <div class="section-heading">
            <div>
              <p class="section-kicker" data-section-kicker="experience">Experience & Education</p>
              <h2 data-section-title="experience">经历与学习</h2>
            </div>
            <div class="section-heading-actions cv-actions" data-cv-actions></div>
          </div>
          <div class="timeline" id="timeline"></div>
        </div>
      </section>

      <section class="section-band steam-section" id="steam">
        <div class="section-inner">
          <div class="section-heading">
            <p class="section-kicker" data-section-kicker="steam">Steam Library</p>
            <h2 data-section-title="steam">游戏库</h2>
            <p class="section-copy" data-section-copy="steam">
              这些游戏记录了我的游玩兴趣、类型偏好和长期体验积累。
            </p>
          </div>
          <div class="steam-summary" id="steam-summary"></div>
          <div class="filter-row steam-filter-row" id="steam-library-filters" aria-label="游戏库分类"></div>
          <div class="steam-grid" id="steam-library-grid"></div>
          <div class="platform-game-modules" id="platform-game-modules"></div>
        </div>
      </section>

      <div id="prototype-detail-route"></div>
    </main>

    <footer class="site-footer" id="contact">
      <div class="section-inner footer-grid">
        <div>
          <p class="section-kicker" data-section-kicker="contact">Contact</p>
          <h2 data-section-title="contact">一起聊聊游戏设计与战斗系统</h2>
        </div>
        <div class="contact-actions" id="footer-links" aria-label="联系链接"></div>
      </div>
      <p class="copyright">© <span data-current-year></span> <span data-profile-name>庞振宁</span></p>
    </footer>

    <script src="script.js?v=20260621-keyword-labels"></script>
  </body>
</html>
